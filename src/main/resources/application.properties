spring.application.name=fruit_box_service

# ===============================
# Spring profile
# ===============================
spring.profiles.active=local

# ===============================
# Server Port
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:username}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:className}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata

# ===============================
# JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway Configuration
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
#spring.flyway.ignore-unsupported-database=true
#spring.flyway.database.postgresql.supported-versions=16,17,18

# ===============================
# Google Clint Configuration
# ===============================
google.client-id=${GOOGLE_CLIENT_ID:clientId}
google.client-secret=${GOOGLE_CLIENT_SECRET:secretId}
google.redirect-uri=${GOOGLE_REDIRECT_URI:redirectUri}

# ===============================
# Cookie Local Configuration
# ===============================
cookie.samesite=${COOKIE_SAMESITE:None}
cookie.secure=${COOKIE_SECURE:true}